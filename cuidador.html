<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Pequeños Cuidados</title>

    <link rel="stylesheet" href="css/estilos.css">

</head>

<body class="body-cuidador">

    <div class="contenedor-formulario">

        <h2 id="cuidador-titulo">
            🖐¡Contanos quién va a acompañar al peque!
        </h2>

        <p id="cuidador-subtitulo">
           Elegí la opción que mejor te represente.
        </p>

        <div class="contenedor-opciones-cuidador">

            <button
             class="tarjeta-cuidador"
              id="cuidador-mama"
              onclick="seleccionarCuidador('Mamá')">
              💜 Mamá
            </button>

             <button
              class="tarjeta-cuidador"
              id="cuidador-papa"
              onclick="seleccionarCuidador('Papá')">
              💙 Papá
             </button>

              <button
                class="tarjeta-cuidador"
                id="cuidador-abuela"
                onclick="seleccionarCuidador('Abuela')">
                💛 Abuela
              </button>

              <button
               class="tarjeta-cuidador"
               id="cuidador-abuelo"
               onclick="seleccionarCuidador('Abuelo')">
               💚 Abuelo
              </button>

              <button
               class="tarjeta-cuidador"
               id="cuidador-tia"
               onclick="seleccionarCuidador('Tía')">
               💖 Tía
              </button>

        </div>

  
 <div class="grupo-campo">

      <label id="cuidador-nombre-label">

        ¿Cómo querés que te llamemos?

      </label>

      <input 

       type="text"
       id="nombre-cuidador"
       class="input-arcoiris"
       placeholder="Ej: Mamá, Laura, Abu Ana">

  </div>


  <div class="zona-boton-siguiente">
         
        <button
            type="button"
            class="btn-guardar-todo"
            id="btn-cuidador-siguiente"
            onclick="guardarCuidadorYContinuar()">

            Siguiente →

        </button>

       </div> 

    </div>

    <script src="js/app.js"></script>

</body>

</html>
