<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pequeños Cuidados - Menú</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body class="body-menu">

    <div class="barra-flotante-superior">

        <!-- Agregar peque -->
        <div class="nido-flotante-peques">

            <span class="cartelito-invitacion">
                Agregá a tu peque 🧸
            </span>

            <button
                class="mini-nube-agregar"
                onclick="irA('peques.html')">
                👣
            </button>

        </div>

    </div>

    <!-- Saludo -->
    <p id="frase-aliento" class="mensaje-aliento">

        🍀¡Hola! ¿Qué hacemos hoy? 😊
    </p>


    <!-- ========================= -->
    <!-- NUBES -->
    <!-- ========================= -->

    <div class="contenedor-nubes">

        <button
            id="nube-medicacion"
            class="nube"
            onclick="irA('medicaciones.html')">
            Medicación 💊
        </button>

        <button
            id="nube-turnos"
            class="nube"
            onclick="irA('misturnos.html')">
            Turnos 📅
        </button>

        <button
            id="nube-vacunas"
            class="nube"
            onclick="irA('vacunas.html')">
            Vacunas 💉
        </button>

    </div>


    <!-- Política -->
    <div class="bloque-privacidad-menu">
        <a
            href="privacidad.html"
            class="enlace-privacidad-menu">
            🔒 Política de Privacidad
        </a>
    </div>

    <script src="js/app.js"></script>

</body>
</html>
